[book]
title = "mcp-twenty-crm"
description = "A self-hosted MCP server for Twenty CRM"
language = "en"
src = "src"

[build]
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output]

[output.html]
site-url = "/mcp-twenty-crm/"
git-repository-url = "https://github.com/Trozz/mcp-twenty-crm"
edit-url-template = "https://github.com/Trozz/mcp-twenty-crm/edit/develop/docs/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
