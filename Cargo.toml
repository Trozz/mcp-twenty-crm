[workspace]
resolver = "3"
members = [
    "crates/mcp-twenty-crm-records",
    "crates/mcp-twenty-crm",
]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Trozz/mcp-twenty-crm"

[workspace.dependencies]
# The shared MCP server base: OAuth 2.1, sign-in, TLS, routing, observability.
mcp-server-core = "0.3"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
axum = "0.8.9"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
metrics = "0.24.6"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
